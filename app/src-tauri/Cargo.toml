[package]
name = "gram"
description = "GRAM (GPU & RAM Aware Matcher) : quels modèles IA tournent en local sur cette machine ?"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# Le suffixe `_lib` évite un conflit de nom entre la lib et le binaire sous Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "gram_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
gram-core.workspace = true
gram-hw.workspace = true
gram-hub.workspace = true
gram-ollama.workspace = true
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio.workspace = true
# Token Hugging Face dans le trousseau du système (Gestionnaire d'identifiants Windows,
# Trousseau d'accès macOS : choisis par l'API v1, fonctionnalité par défaut).
keyring = "4.2.0"
# Pages Hugging Face ouvertes dans le navigateur (fiche détail).
tauri-plugin-opener = "2.7.2"
# Bouton « Copier » des commandes de lancement.
tauri-plugin-clipboard-manager = "2.5.0"
# Dialogue « Enregistrer sous » de l'export, ouvert depuis Rust (aucune permission côté WebView).
tauri-plugin-dialog = "2.8.4"
# Mises à jour depuis les releases GitHub : manifeste `latest.json`, paquets signés (clé publique
# dans tauri.conf.json), appelé depuis Rust seulement (aucune permission côté WebView). Sans `zip` :
# il ne sert qu'aux anciens paquets Windows zippés (Tauri 1), les installeurs sont téléchargés tels quels.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
] }

[lints]
workspace = true

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
# Faux serveur Ollama (tests des mesures).
gram-ollama = { workspace = true, features = ["test-support"] }
