[package]
name = "gram-harness"
description = "GRAM Harness : discuter en local avec les modèles d'Ollama, ajoutés depuis GRAM."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# Le suffixe `_lib` évite un conflit de nom entre la lib et le binaire sous Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "gram_harness_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
gram-core.workspace = true
# Ollama installé mais arrêté, ou absent (seulement quand son API ne répond pas).
gram-hw.workspace = true
gram-ollama.workspace = true
gram-link.workspace = true
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
# Dates des conversations (RFC 3339 dans les fichiers, chaînes côté TypeScript).
chrono.workspace = true
ts-rs.workspace = true
# Images jointes : reçues de l'interface et envoyées à Ollama en base64.
base64 = "0.23.1"
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
# `/api/show` des modèles pas encore vus, en parallèle (`JoinSet`) ; arrêt d'une réponse
# (`Notify`, `select!`).
tokio.workspace = true
# Page de téléchargement d'Ollama, ouverte depuis Rust ; liens des réponses, ouverts depuis la
# WebView (permission limitée à http et https dans capabilities/default.json).
tauri-plugin-opener = "2.7.2"
# Copier une réponse ou un bloc de code ; permission limitée à l'écriture dans
# capabilities/default.json.
tauri-plugin-clipboard-manager = "2.5.0"

[lints]
workspace = true

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
# Faux serveur Ollama.
gram-ollama = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }
