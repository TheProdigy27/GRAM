<div class="box">
  @if (store.attachments().length > 0) {
    <ul class="thumbs" aria-label="Images jointes" data-testid="attachments">
      @for (a of store.attachments(); track a.id) {
        <li class="thumb" data-testid="attachment">
          <img class="thumb__img" [src]="a.url" [alt]="a.name" />
          <button
            type="button"
            class="thumb__remove"
            data-testid="attachment-remove"
            [attr.aria-label]="'Retirer ' + a.name"
            [gTooltip]="'Retirer ' + a.name"
            (click)="detach(a.id)"
          >
            <g-icon name="close" [size]="14" />
          </button>
        </li>
      }
    </ul>
  }
  <textarea
    #input
    class="input"
    rows="1"
    data-testid="composer-input"
    aria-label="Message"
    aria-describedby="composer-hint"
    [placeholder]="placeholder()"
    [value]="store.draft()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (paste)="onPaste($event)"
  ></textarea>
  <div class="tools">
    @if (vision()) {
      <button
        gButton
        variant="ghost"
        icon
        data-testid="composer-attach"
        aria-label="Joindre des images"
        gTooltip="Joindre des images (PNG, JPEG ou WebP, 10 Mo au plus) ; coller ou glisser marche aussi"
        [disabled]="store.attachments().length >= maxImages"
        (click)="file.click()"
      >
        <g-icon name="paperclip" [size]="18" />
      </button>
      <input
        #file
        type="file"
        class="file"
        tabindex="-1"
        aria-hidden="true"
        data-testid="composer-file"
        multiple
        [accept]="accept"
        (change)="onFiles($event)"
      />
    }
    @if (thinking()) {
      <g-switch
        class="think"
        data-testid="composer-think"
        gTooltip="Le modèle réfléchit avant de répondre : plus lent, souvent plus juste. Retenu pour cette conversation."
        [checked]="store.think()"
        (checkedChange)="setThink($event)"
        >Réflexion</g-switch
      >
    }
    <span class="spacer"></span>
    <button
      #instructions
      gButton
      variant="ghost"
      size="sm"
      class="instructions"
      data-testid="composer-instructions"
      [class.instructions--set]="!!store.instructions()"
      [gTooltip]="instructionsTip()"
      (click)="openInstructions()"
    >
      <g-icon [name]="store.instructions() ? 'check' : 'file'" [size]="16" />
      Instructions
      @if (store.instructions()) {
        <span class="g-sr-only"> (définies)</span>
      }
    </button>
    @if (store.streamingHere()) {
      <button
        gButton
        data-testid="composer-stop"
        gTooltip="Arrêter la réponse"
        gTooltipShortcut="Échap"
        (click)="stop()"
      >
        <g-icon name="stop" [size]="16" />
        Arrêter
      </button>
    } @else {
      <button
        gButton
        variant="primary"
        data-testid="composer-send"
        [disabled]="!canSend()"
        (click)="submit()"
      >
        <g-icon name="arrow-up" [size]="16" />
        Envoyer
      </button>
    }
  </div>
</div>
<p id="composer-hint" class="hint" data-testid="composer-hint">{{ hint() }}</p>
