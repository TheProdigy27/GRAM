<header class="header">
  <div class="brand">
    <img class="logo" src="logo.svg" alt="" width="28" height="28" />
    <span class="brand__name">GRAM</span>
  </div>

  <div class="search">
    <div class="search__box" [class.search__box--active]="ranking.search() !== ''">
      <button
        #trigger
        type="button"
        class="search__trigger"
        aria-haspopup="dialog"
        data-testid="search-trigger"
        [attr.aria-keyshortcuts]="searchShortcut"
        (click)="commands.openPalette(trigger)"
      >
        <g-icon name="search" />
        @if (ranking.search(); as active) {
          <span class="search__text" data-testid="search-active"
            ><span class="g-sr-only">Recherche : </span>{{ active }}</span
          >
        } @else {
          <span class="search__text search__text--placeholder"
            >Rechercher un modèle ou une commande…</span
          >
        }
        <kbd class="g-kbd" aria-hidden="true">{{ searchShortcutLabel }}</kbd>
      </button>
      @if (ranking.search() !== '') {
        <button
          type="button"
          class="search__clear"
          aria-label="Effacer la recherche"
          data-testid="search-clear"
          gTooltip="Effacer la recherche"
          (click)="clearSearch()"
        >
          <g-icon name="close" />
        </button>
      }
    </div>
  </div>

  <div class="actions">
    <button
      gButton
      variant="ghost"
      data-testid="refresh-catalog"
      gTooltip="Synchroniser le catalogue avec Hugging Face"
      [busy]="catalog.syncing()"
      (click)="commands.refreshCatalog()"
    >
      @if (!catalog.syncing()) {
        <g-icon name="sync" />
      }
      Actualiser les modèles
    </button>
    <button
      gButton
      variant="ghost"
      data-testid="export"
      gTooltip="Enregistrer le classement affiché, en entier"
      gTooltipShortcut="E"
      [cdkMenuTriggerFor]="exportMenu"
      [busy]="commands.exporting()"
      [disabled]="!ranking.response()"
    >
      @if (!commands.exporting()) {
        <g-icon name="download" />
      }
      Exporter
      <g-icon name="chevron-down" [size]="14" />
    </button>
    <ng-template #exportMenu>
      <g-menu aria-label="Exporter le classement">
        <button
          gMenuItem
          icon="file"
          shortcut="M"
          data-testid="export-md"
          (triggered)="commands.exportRanking('md')"
        >
          Markdown (.md)
        </button>
        <button
          gMenuItem
          icon="table"
          shortcut="C"
          data-testid="export-csv"
          (triggered)="commands.exportRanking('csv')"
        >
          CSV pour Excel (.csv)
        </button>
      </g-menu>
    </ng-template>

    <span class="separator" aria-hidden="true"></span>

    @if (updates.available(); as u) {
      <button
        gButton
        variant="primary"
        data-testid="open-update"
        [gTooltip]="'Installer GRAM ' + u.version"
        (click)="commands.openUpdate()"
      >
        <g-icon name="update" />
        Mise à jour {{ u.version }}
      </button>
    } @else {
      <button
        gButton
        variant="ghost"
        icon
        data-testid="open-update"
        aria-label="Rechercher une mise à jour"
        gTooltip="Rechercher une mise à jour"
        (click)="commands.openUpdate()"
      >
        <g-icon name="update" [size]="18" />
      </button>
    }
    <button
      gButton
      variant="ghost"
      icon
      data-testid="open-settings"
      aria-label="Paramètres"
      gTooltip="Paramètres"
      (click)="commands.openSettings()"
    >
      <g-icon name="settings" [size]="18" />
    </button>
  </div>
</header>

<app-hardware-banner [compact]="detail.isOpen()" />

<div class="body" [class.body--docked]="detail.isOpen()">
  <div class="workspace">
    <app-filters-panel
      id="filters-panel"
      class="filters"
      [class.filters--open]="filtersOpen()"
      (focusout)="onFiltersFocusOut($event)"
    />
    <app-ranking-view
      class="main"
      [docked]="detail.isOpen()"
      [filtersOpen]="filtersOpen()"
      (filtersToggle)="toggleFilters()"
    />
  </div>
  @if (detail.isOpen()) {
    <div #pane class="detail-pane" data-testid="detail-pane">
      <app-model-detail (dismiss)="closeDetail(true)" />
    </div>
  }
</div>

<app-status-bar />
