<mat-toolbar class="toolbar">
  <mat-icon aria-hidden="true">memory</mat-icon>
  <span class="brand">GRAM</span>
  <span class="tagline">GPU &amp; RAM Aware Matcher</span>
  <span class="spacer"></span>
  <button
    mat-button
    type="button"
    data-testid="rescan"
    matTooltip="Détecter de nouveau le matériel et les runtimes"
    [disabled]="hardware.scanning()"
    (click)="rescan()"
  >
    <mat-icon>refresh</mat-icon>
    Ré-analyser
  </button>
  <button
    mat-button
    type="button"
    data-testid="refresh-catalog"
    matTooltip="Synchroniser le catalogue avec Hugging Face"
    [disabled]="catalog.syncing()"
    (click)="refreshCatalog()"
  >
    <mat-icon>cloud_sync</mat-icon>
    Actualiser les modèles
  </button>
</mat-toolbar>

<app-hardware-banner />

<mat-drawer-container class="body" [hasBackdrop]="false">
  <mat-drawer
    class="detail-drawer"
    position="end"
    mode="over"
    [opened]="detail.isOpen()"
    (closedStart)="detail.close()"
  >
    @if (detail.isOpen()) {
      <app-model-detail />
    }
  </mat-drawer>
  <mat-drawer-content class="workspace">
    <app-filters-panel class="filters" />
    <app-ranking-view class="main" />
  </mat-drawer-content>
</mat-drawer-container>

<app-status-bar />
