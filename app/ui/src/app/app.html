<header class="header">
  <div class="brand">
    <img class="logo" src="logo.svg" alt="" width="28" height="28" />
    <span class="brand__name">GRAM</span>
  </div>

  <div class="search" role="search">
    <g-field clearable clearLabel="Effacer la recherche">
      <g-icon gPrefix name="search" />
      <input
        #search
        gInput
        type="text"
        autocomplete="off"
        spellcheck="false"
        aria-label="Rechercher un modèle"
        placeholder="Rechercher par nom, dépôt ou modèle de base…"
        data-testid="filter-search"
        [attr.aria-keyshortcuts]="searchShortcut"
        [value]="ranking.search()"
        (input)="ranking.setSearch(search.value)"
        (keydown.escape)="clearSearch($event)"
      />
      <kbd gSuffix class="g-kbd search__kbd" aria-hidden="true">{{ searchShortcutLabel }}</kbd>
    </g-field>
  </div>

  <div class="actions">
    <button
      gButton
      variant="ghost"
      data-testid="refresh-catalog"
      gTooltip="Synchroniser le catalogue avec Hugging Face"
      [busy]="catalog.syncing()"
      (click)="refreshCatalog()"
    >
      @if (!catalog.syncing()) {
        <g-icon name="sync" />
      }
      Actualiser les modèles
    </button>
    <button
      gButton
      variant="ghost"
      data-testid="export"
      gTooltip="Enregistrer le classement affiché, en entier"
      gTooltipShortcut="E"
      [cdkMenuTriggerFor]="exportMenu"
      [busy]="exporting()"
      [disabled]="!ranking.response()"
    >
      @if (!exporting()) {
        <g-icon name="download" />
      }
      Exporter
      <g-icon name="chevron-down" [size]="14" />
    </button>
    <ng-template #exportMenu>
      <g-menu aria-label="Exporter le classement">
        <button
          gMenuItem
          icon="file"
          shortcut="M"
          data-testid="export-md"
          (triggered)="exportRanking('md')"
        >
          Markdown (.md)
        </button>
        <button
          gMenuItem
          icon="table"
          shortcut="C"
          data-testid="export-csv"
          (triggered)="exportRanking('csv')"
        >
          CSV pour Excel (.csv)
        </button>
      </g-menu>
    </ng-template>

    <span class="separator" aria-hidden="true"></span>

    @if (updates.available(); as u) {
      <button
        gButton
        variant="primary"
        data-testid="open-update"
        [gTooltip]="'Installer GRAM ' + u.version"
        (click)="openUpdate()"
      >
        <g-icon name="update" />
        Mise à jour {{ u.version }}
      </button>
    } @else {
      <button
        gButton
        variant="ghost"
        icon
        data-testid="open-update"
        aria-label="Rechercher une mise à jour"
        gTooltip="Rechercher une mise à jour"
        (click)="openUpdate()"
      >
        <g-icon name="update" [size]="18" />
      </button>
    }
    <button
      gButton
      variant="ghost"
      icon
      data-testid="open-settings"
      aria-label="Paramètres"
      gTooltip="Paramètres"
      (click)="openSettings()"
    >
      <g-icon name="settings" [size]="18" />
    </button>
  </div>
</header>

<app-hardware-banner [compact]="detail.isOpen()" />

<div class="body" [class.body--docked]="detail.isOpen()">
  <div class="workspace">
    <app-filters-panel
      id="filters-panel"
      class="filters"
      [class.filters--open]="filtersOpen()"
      (focusout)="onFiltersFocusOut($event)"
    />
    <app-ranking-view
      class="main"
      [docked]="detail.isOpen()"
      [filtersOpen]="filtersOpen()"
      (filtersToggle)="toggleFilters()"
    />
  </div>
  @if (detail.isOpen()) {
    <div #pane class="detail-pane" data-testid="detail-pane">
      <app-model-detail (dismiss)="closeDetail(true)" />
    </div>
  }
</div>

<app-status-bar />
