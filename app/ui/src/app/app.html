<mat-toolbar class="toolbar">
  <img class="logo" src="logo.svg" alt="" width="28" height="28" />
  <span class="brand">GRAM</span>
  <span class="tagline">GPU &amp; RAM Aware Matcher</span>
  <span class="spacer"></span>
  <button
    mat-button
    type="button"
    data-testid="rescan"
    matTooltip="Détecter de nouveau le matériel et les runtimes"
    [disabled]="hardware.scanning()"
    (click)="rescan()"
  >
    <mat-icon>refresh</mat-icon>
    Ré-analyser
  </button>
  <button
    mat-button
    type="button"
    data-testid="refresh-catalog"
    matTooltip="Synchroniser le catalogue avec Hugging Face"
    [disabled]="catalog.syncing()"
    (click)="refreshCatalog()"
  >
    <mat-icon>cloud_sync</mat-icon>
    Actualiser les modèles
  </button>
  <button
    mat-button
    type="button"
    data-testid="export"
    matTooltip="Enregistrer le classement affiché, en entier"
    [matMenuTriggerFor]="exportMenu"
    [disabled]="exporting() || !ranking.response()"
  >
    <mat-icon>download</mat-icon>
    Exporter
  </button>
  <mat-menu #exportMenu="matMenu">
    <button mat-menu-item type="button" data-testid="export-md" (click)="exportRanking('md')">
      <mat-icon>article</mat-icon>
      Markdown (.md)
    </button>
    <button mat-menu-item type="button" data-testid="export-csv" (click)="exportRanking('csv')">
      <mat-icon>table</mat-icon>
      CSV pour Excel (.csv)
    </button>
  </mat-menu>
  @if (updates.available(); as u) {
    <button
      mat-flat-button
      type="button"
      data-testid="open-update"
      [matTooltip]="'Installer GRAM ' + u.version"
      (click)="openUpdate()"
    >
      <mat-icon>system_update_alt</mat-icon>
      Mise à jour {{ u.version }}
    </button>
  } @else {
    <button
      mat-icon-button
      type="button"
      data-testid="open-update"
      aria-label="Rechercher une mise à jour"
      matTooltip="Rechercher une mise à jour"
      (click)="openUpdate()"
    >
      <mat-icon>system_update_alt</mat-icon>
    </button>
  }
  <button
    mat-icon-button
    type="button"
    data-testid="open-settings"
    aria-label="Paramètres"
    matTooltip="Paramètres"
    (click)="openSettings()"
  >
    <mat-icon>settings</mat-icon>
  </button>
</mat-toolbar>

<app-hardware-banner />

<mat-drawer-container class="body" [hasBackdrop]="false">
  <mat-drawer
    class="detail-drawer"
    position="end"
    mode="over"
    [opened]="detail.isOpen()"
    (closedStart)="detail.close()"
  >
    @if (detail.isOpen()) {
      <app-model-detail />
    }
  </mat-drawer>
  <mat-drawer-content class="workspace">
    <app-filters-panel class="filters" />
    <app-ranking-view class="main" />
  </mat-drawer-content>
</mat-drawer-container>

<app-status-bar />
