[package]
name = "gram-ollama"
description = "API locale d'Ollama : modèles installés, mesure réelle, ajout pour GRAM Harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Faux serveur Ollama (`testing`), pour les tests de l'application.
test-support = []

[dependencies]
gram-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Délai entre deux morceaux d'un flux, annulation d'un ajout (`select!`).
tokio.workspace = true
# HTTP simple vers localhost : ni TLS, ni compression. `Response::chunk` suffit pour lire un
# flux, sans la fonctionnalité `stream`.
reqwest.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
