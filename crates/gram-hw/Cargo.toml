[package]
name = "gram-hw"
description = "Détection du matériel et des runtimes installés (Windows ; stub ailleurs)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gram-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "disk"] }
tracing.workspace = true

[lints]
workspace = true

[target."cfg(windows)".dependencies]
nvml-wrapper = "0.13.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_DXCore", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }
wmi = "0.18.4"
