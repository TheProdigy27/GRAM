[package]
name = "gram-hub"
description = "Client Hugging Face, cache, parseur d'en-tête GGUF et snapshot du catalogue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gram-core.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
regex = "1.13.1"
# Pas de TLS natif : rustls (fournisseur aws-lc-rs) et certificats du magasin Windows.
reqwest = { workspace = true, features = ["rustls", "gzip", "http2"] }
url = "2.5.8"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
